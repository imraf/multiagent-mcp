[project]
name = "mcp-infra"
version = "0.1.0"
description = "Infrastructure foundation for MCP agents"
authors = [{name = "Infrastructure Agent", email = "agent@example.com"}]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=23.1.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "sse-starlette>=1.6.0",
    "mcp>=0.1.0",
    "httpx>=0.24.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "shellingham>=1.5.0",
    "jinja2>=3.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "streamlit>=1.24.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_infra", "src/mcp_transport", "src/mcp_core", "src/mcp_server"]

[project.entry-points."mcp_invoice.plugins"]
# Example: my_plugin = "my_package.module:register_plugin"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "PL", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src"
